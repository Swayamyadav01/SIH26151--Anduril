<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeProxy — Threat Intelligence Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#14b8a6',
                        'primary-dark': '#0f766e',
                        'primary-light': '#ccfbf1',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        success: '#10b981',
                        background: '#f8fafc',
                        surface: '#ffffff',
                        'border-color': '#e2e8f0',
                        'text-main': '#334155',
                        'text-muted': '#64748b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vis Network -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-text-main font-sans antialiased h-screen overflow-hidden flex">
    
    <!-- Sidebar -->
    <aside class="w-60 bg-surface border-r border-border-color flex flex-col h-full z-20 shadow-sm flex-shrink-0" id="sidebar">
        <!-- Brand -->
        <div class="h-16 flex items-center px-5 border-b border-border-color flex-shrink-0">
            <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center mr-2.5">
                <i class="fa-solid fa-shield-halved text-white text-sm"></i>
            </div>
            <span class="text-lg font-bold text-gray-800 tracking-tight">DeProxy</span>
        </div>
        <!-- Platform Label -->
        <div class="px-5 pt-4 pb-2 flex-shrink-0">
            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">ThreatCam</span>
            <p class="text-[11px] text-gray-400 mt-0.5">Threat Intelligence Platform</p>
        </div>
        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto px-3 py-2" id="sidebar-nav">
            <!-- Populated by app.js -->
        </nav>
        <!-- Sidebar Footer -->
        <div class="p-3 border-t border-border-color flex-shrink-0">
            <a href="#" class="flex items-center text-gray-400 hover:text-primary transition-colors text-sm px-3 py-2 rounded-lg hover:bg-gray-50">
                <i class="fa-solid fa-gear w-5 text-center mr-3 text-[13px]"></i>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
        <!-- Top Header Bar -->
        <header class="h-16 bg-surface border-b border-border-color flex items-center justify-between px-6 shadow-sm z-10 flex-shrink-0">
            <div class="flex items-center min-w-0">
                <button class="text-gray-400 hover:text-gray-700 mr-4 lg:hidden" id="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="min-w-0">
                    <h2 class="text-lg font-semibold text-gray-800 truncate" id="current-page-title">Dashboard</h2>
                    <span class="text-xs text-text-muted" id="current-page-subtitle">Welcome back, Security Analyst</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 flex-shrink-0">
                <!-- Search -->
                <div class="relative hidden md:block">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400 text-sm"></i>
                    </div>
                    <input type="text" class="block w-56 lg:w-72 pl-9 pr-16 py-2 border border-border-color rounded-full text-sm placeholder-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors bg-gray-50/50" placeholder="Search services, personas, wallets...">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <span class="text-[10px] text-gray-400 border border-gray-200 rounded px-1.5 py-0.5 bg-white font-mono">Ctrl+K</span>
                    </div>
                </div>
                
                <!-- Notifications -->
                <button class="relative text-gray-400 hover:text-gray-700 transition-colors p-2 rounded-lg hover:bg-gray-50">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute top-1 right-1 flex h-4 w-4">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-danger opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-4 w-4 bg-danger text-[9px] text-white items-center justify-center font-bold border-2 border-surface">3</span>
                    </span>
                </button>
                
                <!-- Help -->
                <button class="text-gray-400 hover:text-gray-700 transition-colors p-2 rounded-lg hover:bg-gray-50 hidden lg:block">
                    <i class="fa-regular fa-circle-question text-lg"></i>
                </button>
                
                <!-- User Avatar -->
                <div class="flex items-center space-x-2 border-l border-border-color pl-3 ml-1">
                    <div class="w-8 h-8 rounded-full bg-primary-light text-primary flex items-center justify-center font-bold text-xs">
                        SA
                    </div>
                    <div class="hidden lg:block">
                        <div class="text-sm font-medium text-gray-700 leading-tight">Analyst</div>
                        <div class="text-[10px] text-gray-400 leading-tight">Security Team</div>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 cursor-pointer hidden lg:block"></i>
                </div>
            </div>
        </header>

        <!-- Main Scrollable Content Area -->
        <main class="flex-1 overflow-y-auto bg-background p-6" id="main-content">
            <!-- Dynamic Content Rendered Here by app.js -->
        </main>
    </div>

    <!-- View Scripts (order matters — loaded before app.js wires them) -->
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/discover.js"></script>
    <script src="js/views/services.js"></script>
    <script src="js/views/personas.js"></script>
    <script src="js/views/infrastructure.js"></script>
    <script src="js/views/graph.js"></script>
    <script src="js/views/investigations.js"></script>
    <script src="js/views/alerts.js"></script>
    <script src="js/views/stylometry.js"></script>
    <script src="js/views/reports.js"></script>
    <script src="js/views/sources.js"></script>
    <script src="js/views/watchlist.js"></script>
    <!-- Main App (loaded last) -->
    <script src="js/app.js"></script>
</body>
</html>
