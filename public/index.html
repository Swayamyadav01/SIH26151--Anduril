<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anduril — Intelligence</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <script>
        try {
            const saved = localStorage.getItem('anduril_theme') || localStorage.getItem('deproxy_theme');
            document.documentElement.classList.toggle('dark', saved === 'dark');
        } catch (_) {}
    </script>
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <script defer src="vendor/vis-network.min.js"></script>
    <script defer src="vendor/chart.umd.js"></script>
    <script defer src="vendor/globe.gl.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-text-main font-sans antialiased h-screen overflow-hidden flex transition-colors duration-200">
    
    <!-- Sidebar -->
    <aside class="w-60 bg-surface border-r border-border-color flex flex-col h-full z-20 shadow-xs flex-shrink-0 transition-colors duration-200" id="sidebar">
        <!-- Brand -->
        <div class="h-16 flex items-center px-5 border-b border-border-color flex-shrink-0">
            <img src="assets/anduril-mark.svg" alt="" width="36" height="36" class="mr-3">
            <span class="brand-wordmark">Anduril</span>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5" id="sidebar-nav">
            <!-- Populated by app.js -->
        </nav>
        
        <!-- Sidebar Footer Status Indicator (Cleaned - No dummy settings) -->
        <div class="p-3 border-t border-border-color flex-shrink-0">
            <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-surface-secondary text-xs text-text-muted">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="font-medium text-[11px]">Engine active</span>
                </div>
                <span class="font-mono text-[10px] opacity-75">v1.2.0</span>
            </div>
        </div>
    </aside>

    <button id="sidebar-backdrop" aria-label="Close navigation" hidden></button>
    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
        <!-- Top Header Bar (Cleaned - No dummy analyst profile or help button) -->
        <header class="h-16 bg-surface border-b border-border-color flex items-center justify-between px-6 shadow-xs z-10 flex-shrink-0 transition-colors duration-200">
            <div class="flex items-center min-w-0">
                <button class="text-text-muted hover:text-text-main mr-4 lg:hidden" id="mobile-menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="min-w-0">
                    <h2 class="text-base font-semibold text-text-main truncate" id="current-page-title">Dashboard</h2>
                </div>
            </div>
            
            <div class="flex items-center space-x-2.5 flex-shrink-0">
                <!-- Search Button / Quick Search Bar -->
                <div class="relative">
                    <button id="search-trigger-btn" aria-label="Search intelligence" aria-haspopup="dialog" class="flex items-center justify-between w-9 sm:w-52 md:w-64 px-3 py-1.5 border border-border-color rounded-lg text-xs text-text-muted bg-surface-secondary hover:border-primary/50 transition-all duration-150 cursor-pointer">
                        <span class="flex items-center gap-2 truncate">
                            <i class="fa-solid fa-search text-[11px] text-text-muted"></i>
                            <span class="truncate hidden sm:inline">Search intelligence...</span>
                        </span>
                        <kbd class="hidden sm:inline font-mono text-[10px] px-1.5 py-0.5 rounded border border-border-color bg-surface text-text-muted">Ctrl K</kbd>
                    </button>
                </div>

                <!-- Theme Toggle Button (Light/Dark Mode) -->
                <button id="theme-toggle" aria-label="Switch color theme" class="w-9 h-9 rounded-lg border border-border-color text-text-muted hover:text-text-main hover:bg-surface-secondary flex items-center justify-center transition-all duration-200 cursor-pointer" title="Toggle Light / Dark Mode">
                    <i class="fa-solid fa-moon text-xs dark:hidden"></i>
                    <i class="fa-solid fa-sun text-xs hidden dark:block text-amber-400"></i>
                </button>
                
                <!-- Alerts / Notifications -->
                <button onclick="navigateTo('alerts')" class="relative text-text-muted hover:text-text-main transition-colors p-2 rounded-lg hover:bg-surface-secondary w-9 h-9 flex items-center justify-center border border-border-color cursor-pointer" title="Alerts">
                    <i class="fa-regular fa-bell text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Content Area -->
        <main class="flex-1 overflow-y-auto bg-background p-4 sm:p-6 transition-colors duration-200" id="main-content">
            <!-- Dynamic Content Rendered Here by app.js -->
        </main>
    </div>

    <!-- Quick Search Modal (Command Palette) -->
    <div id="search-modal" role="dialog" aria-modal="true" aria-label="Search intelligence" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-start justify-center pt-20 px-4 hidden">
        <div class="bg-surface border border-border-color rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <div class="p-3 border-b border-border-color flex items-center gap-3">
                <i class="fa-solid fa-search text-text-muted text-sm pl-2"></i>
                <input type="text" id="modal-search-input" role="combobox" aria-label="Search intelligence records" aria-autocomplete="list" aria-controls="modal-search-results" aria-expanded="false" class="w-full bg-transparent text-text-main placeholder-text-muted text-sm focus:outline-none" placeholder="Search actors, IPs, or services">
                <button type="button" aria-label="Close search" id="modal-close-btn" class="font-mono text-[10px] px-1.5 py-0.5 rounded border border-border-color bg-surface-secondary text-text-muted cursor-pointer">ESC</button>
            </div>
            <div id="modal-search-results" role="listbox" aria-label="Intelligence results" class="max-h-72 overflow-y-auto p-2 divide-y divide-border-color/50 text-xs">
                <!-- Search results injected dynamically -->
            </div>
            <div class="p-2.5 bg-surface-secondary border-t border-border-color flex justify-between items-center text-[11px] text-text-muted">
                <span>↑ ↓ to select · Enter to open</span>
                <span>Press <kbd class="font-mono px-1 rounded bg-surface border border-border-color">ESC</kbd> to close</span>
            </div>
        </div>
    </div>

    <!-- View Scripts (order matters — loaded before app.js wires them) -->
    <script defer src="js/views/dashboard.js"></script>
    <script defer src="js/views/discover.js"></script>
    <script defer src="js/views/services.js"></script>
    <script defer src="js/views/personas.js"></script>
    <script defer src="js/views/infrastructure.js"></script>
    <script defer src="js/views/graph.js"></script>
    <script defer src="js/views/investigations.js"></script>
    <script defer src="js/views/alerts.js"></script>
    <script defer src="js/views/stylometry.js"></script>
    <script defer src="js/views/reports.js"></script>
    <script defer src="js/views/sources.js"></script>
    <script defer src="js/views/watchlist.js"></script>
    <!-- Main App (loaded last) -->
    <script defer src="js/app.js"></script>
</body>
</html>
